plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.echolab.pleosecholog'
    compileSdk 34

    defaultConfig {
        applicationId "io.echolab.pleosecholog"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0-pleos"
    }

    signingConfigs {
        release {
            storeFile file("echolab-release.jks")
            storePassword "pleosecholog"
            keyAlias "echolab"
            keyPassword "pleosecholog"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Official Hyundai Motor Group Pleos Connect SDKs (from https://nexus-playground.pleos.ai/repository/maven-releases/)
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'ai.pleos.playground:FusedLocation:1.1.3'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    implementation 'ai.pleos.playground:TextToSpeech:3.3.1'
    implementation 'ai.pleos.playground:SpeechToText:3.3.1'

    // Geo-Spatial Cloud DB REST / WebSocket Transport (PostGIS + 7-char GeoHash Tiles)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
